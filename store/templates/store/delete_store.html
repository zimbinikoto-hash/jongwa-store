<!DOCTYPE html>
<html>
<head>
    <title>Jongwa Store - Delete Store</title>
</head>
<body>
    <h1>Delete Store</h1>

    <p>Are you sure you want to delete "{{ store.name }}"?</p>

    <form method="POST">
        {% csrf_token %}
        <button type="submit">Yes, Delete Store</button>
    </form>

    <p>
        <a href="{% url 'vendor_dashboard' %}">
            Cancel
        </a>
    </p>
</body>
</html>
