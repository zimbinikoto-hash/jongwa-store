
<!DOCTYPE html>
<html>
<head>
    <title>Jongwa Store - Login</title>
</head>
<body>

    <h1>Jongwa Store</h1>
    <h2>Login to Your Account</h2>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Login</button>
    </form>

    <p>
        <a href="{% url 'password_reset' %}">
            Forgot Password?
        </a>
    </p>

    <p>Don't have an account?
        <a href="{% url 'register' %}">Register here</a>
    </p>

</body>
</html>
